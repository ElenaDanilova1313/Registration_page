<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>homeWork</title>
    <link rel="stylesheet" href="css/styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<div class="body__container">
    <a href="#" class="logo">
        <img src="images/homeWorks.png" alt="Logo" class="logo__img">
    </a>
    <section class="body_container-general">
        <section class="registration">
            <section class="registration__container">
                <h2 class="registration__title">Get your free account</h2>
                <article class="registration__text">
                    Try homeWorks BUSINESS free for 15 days.
                    Downgrade to Basic (Free Forever) anytime.
                </article>
                <form class="registration__form">
                    <label class="registration__label">Full Name
                        <input type="text" class="input registration__input-fullname">
                    </label>
                    <label class="registration__label">Your username
                        <input type="text" class="input registration__input-username">
                    </label>
                    <label class="registration__label">E-mail
                        <input type="text" class="input registration__input-email">
                    </label>
                    <div class="registration__password-wrapper">
                        <label class="registration__label">Password
                            <input type="password" class="input">
                            <button class="toggle-password" type="button">
                                <!-- Глаз открытый -->
                                <svg class="eyeOpen" viewBox="0 0 24 24">
                                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                                </svg>
                                <!-- Глаз закрытый -->
                                <svg class="eyeClosed" viewBox="0 0 24 24">
                                    <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2z"/>
                                </svg>
                            </button>
                        </label>
                    </div>
                    <div class="registration__password-wrapper">
                        <label class="registration__label">Repeat Password
                            <input type="password" class="input">
                            <button class="toggle-password" type="button">
                                <!-- Глаз открытый -->
                                <svg class="eyeOpen" viewBox="0 0 24 24">
                                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                                </svg>
                                <!-- Глаз закрытый (скрыт по умолчанию) -->
                                <svg class="eyeClosed" viewBox="0 0 24 24">
                                    <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2z"/>
                                </svg>
                            </button>
                        </label>
                    </div>
                    <label class="registration__checkbox-text">
                        <input type="checkbox" class="registration__input-checkbox" checked>
                        Agree to our Terms of Service and Privacy Statement
                    </label>
                    <button class="registration__btn">Sing Up</button>
                </form>
                <div class="registration__question">
                    <a href="#" class="registration__question-text">Already have an account?</a>
                </div>
            </section>
        </section>

        <section class="container__image">
            <section class="image">
                <img src="images/image.png" alt="start" class="image__img">
            </section>
        </section>

        <figure class="modalWindow">
            <section class="modalWindow__content">
                <article class="modalWindow__text">На вашу почту выслана ссылка, перейдите по ней, чтобы завершить
                    регистрацию
                </article>
                <button class="modalBtn">ОК</button>
            </section>
        </figure>

    </section>
</div>


<script src="index.js"></script>
</body>
</html>
